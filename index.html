<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- Makes the page work on phones -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WagaShelf</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
    <link rel="stylesheet" href="style.css">

</head>
<body>
    <h1>WagaShelf</h1>

    <!-- The form: like the Entry widgets in your Password Manager -->
    <section id="search">
        <input type="search" id="search-input" placeholder="Search for titles">
        <button id="search-btn">Search</button>
        <div id="search-results"></div>
    </section>
    <section id="add-entry">
        <input type="search" id="title" placeholder="Title (e.g. Solo Leveling)">

        <select id="type">
            <option value="Manga">Manga</option>
            <option value="Anime">Anime</option>
            <option value="Manhwa">Manhwa</option>
            <option value="Comic">Comic</option>
            <option value="Novel">Novel</option>
            <option value="Manhua">Manhua</option>
        </select>

        <select id="status">
            <option value="planning">Plan to Read</option>
            <option value="current">Reading</option>
            <option value="completed">Completed</option>
            <option value="on-hold">On-hold</option>
            <option value="dropped">Dropped</option>
            <option value="revisiting">Re-reading</option>
        </select>

        <input type="number" id="rating" min="1" max="10" placeholder="Rating (1-10)">

        <button id="add-btn">Add</button>
    </section>

    <!-- Entries will be added here by JavaScript -->
    <ul id="list"></ul>

    <!-- Loaded last so the HTML above exists before the JS runs -->
    <script src="api.js"></script>
    <script src="app.js"></script>
</body>
</html>

# Render "Blueprint": describes the backend service so Render can create it from this repo.
# Secret values (DATABASE_URL, CLERK_ISSUER) are marked sync: false, so Render asks for them
# in its dashboard instead of reading them from this file.
services:
  - type: web
    name: wagashelf-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: DATABASE_URL
        sync: false
      - key: CLERK_ISSUER
        sync: false
      - key: CLERK_AUTHORIZED_PARTIES
        value: https://obich1.github.io
      - key: FRONTEND_ORIGINS
        value: https://obich1.github.io
